name: CharlieTraining
options:
  bundleIdPrefix: fr.charlie
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_BUNDLE_IDENTIFIER: fr.charlie.training
    DEVELOPMENT_TEAM: ""
targets:
  CharlieTraining:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - README.md
          - project.yml
    info:
      path: Info.plist
    entitlements:
      path: CharlieTraining.entitlements
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
