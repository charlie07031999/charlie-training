name: CharlieTraining
options:
  bundleIdPrefix: fr.charlie
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_BUNDLE_IDENTIFIER: fr.charlie.training
    DEVELOPMENT_TEAM: ""
targets:
  CharlieTraining:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - README.md
          - project.yml
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Charlie Training
        NSHealthShareUsageDescription: Charlie utilise tes données Santé pour adapter ton sommeil, ta récupération, tes entraînements et ton suivi quotidien.
        NSHealthUpdateUsageDescription: Charlie peut enregistrer dans Santé les entraînements, le sommeil et le poids ajoutés dans l’app.
        NSLocationWhenInUseUsageDescription: Charlie utilise ta position pendant tes courses pour enregistrer la distance, l’allure et le parcours.
        UILaunchScreen: {}
    entitlements:
      path: CharlieTraining.entitlements
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
